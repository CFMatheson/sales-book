<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>Sales Book</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2a24;
    --muted: #66706a;
    --line: #e2ddd2;
    --brand: #2f6b4f;
    --brand-ink: #ffffff;
    --accent: #b5532d;
    --ok: #2f6b4f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17; --card: #1f2621; --ink: #e9ece9; --muted: #9aa49e;
      --line: #313a34; --brand: #4f9c76; --brand-ink: #0d1410; --accent: #e08a62;
      --ok: #6cc196;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 150px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-ink);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 650; }
  header small { display: block; font-size: 13px; opacity: .85; font-weight: 400; }
  .icon-btn { background: transparent; border: 0; color: inherit; font-size: 26px; width: 44px; height: 44px;
    border-radius: 10px; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; }
  .daterow { display: flex; align-items: center; gap: 8px; }
  .daterow input { flex: 1; text-align: center; font-weight: 600; }
  .day { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 48px; }
  input:focus, select:focus { outline: none; border-color: var(--brand); }
  input:disabled, select:disabled { opacity: .55; }
  .big { font-size: 22px; font-weight: 700; }
  .center { text-align: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    min-height: 52px; border: 0; border-radius: 12px; font: inherit; font-weight: 650; cursor: pointer;
    background: var(--brand); color: var(--brand-ink); margin-top: 14px; }
  .btn.secondary { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn.danger { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.small { min-height: 40px; width: auto; padding: 0 14px; margin: 0; font-size: 15px; }
  .btn.link { background: transparent; color: var(--brand); min-height: 40px; margin: 0; width: auto;
    padding: 0 6px; text-decoration: underline; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; min-width: 0; }
  .row > .w2 { flex: 2; }
  .lineTotal { text-align: right; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .lineTotal b { color: var(--ink); font-size: 20px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; }
  .summary b { font-size: 22px; }
  .vendor { padding: 0; overflow: hidden; }
  .vendor h3 { margin: 0; padding: 12px 14px; font-size: 17px; display: flex; justify-content: space-between;
    border-bottom: 1px solid var(--line); }
  .vendor h3 span { color: var(--muted); font-weight: 500; font-size: 14px; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .line:active { background: var(--bg); }
  .line .what { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .tag { color: var(--ok); font-size: 13px; margin-left: 6px; }
  .totals { padding: 10px 14px; font-variant-numeric: tabular-nums; }
  .totals div, .sum div { display: flex; justify-content: space-between; gap: 10px; }
  .totals .due, .sum .due { font-weight: 700; }
  .sum { font-variant-numeric: tabular-nums; background: var(--bg); border-radius: 10px; padding: 10px 12px;
    margin-top: 10px; font-size: 16px; }
  .cardfoot { display: flex; justify-content: flex-end; padding: 0 8px 8px; }
  .cardtitle { margin: 0 0 2px; font-size: 18px; }
  h2.section { font-size: 18px; margin: 20px 4px 10px; }
  .vhead { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer; }
  .vhead .name { font-weight: 650; font-size: 17px; }
  .vhead .meta { color: var(--muted); font-size: 14px; }
  .vhead .owed { font-weight: 700; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .vhead .chev { color: var(--muted); font-size: 14px; margin-left: 4px; }
  .vbody { border-top: 1px solid var(--line); }
  .dayhead { display: flex; justify-content: space-between; padding: 8px 14px 4px; font-size: 14px;
    color: var(--muted); font-weight: 600; background: var(--bg); }
  .vfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; }
  .vfoot .btn { width: auto; padding: 0 20px; margin: 0; min-height: 44px; }
  .grand { font-weight: 700; }
  .grand b { font-size: 24px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
    border-top: 1px solid var(--line); }
  footer .btn { margin: 0 auto; max-width: 608px; display: flex; }
  footer .btn + .btn { margin-top: 8px; }
  dialog { border: 0; border-radius: 18px; padding: 18px; width: min(94vw, 480px); max-height: 92vh;
    background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 6px; font-size: 19px; }
  dialog p { margin: 6px 0; color: var(--muted); font-size: 15px; }
  .menu .btn { margin-top: 10px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--brand);
    background: transparent; color: var(--brand); font: inherit; font-weight: 650; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); }
  .ded { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .ded input:first-child { flex: 2; }
  .ded input:nth-child(2) { flex: 1; }
  .ded button { flex: 0 0 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 20px; }
  .plist .line { cursor: default; }
  .toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--ink);
    color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 20; }
  .toast.show { opacity: 1; }
  .hint { font-size: 14px; color: var(--muted); }
  .warn { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Sales Book<small id="bizName"></small></h1>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
</header>

<main>
  <section class="card" id="entry">
    <h2 class="cardtitle">Add a Sale</h2>
    <label for="saleDate">Date of sale</label>
    <div class="daterow">
      <button class="btn secondary small" id="prevDay" aria-label="Previous day">&#8249;</button>
      <input type="date" id="saleDate" aria-label="Date of sale">
      <button class="btn secondary small" id="nextDay" aria-label="Next day">&#8250;</button>
    </div>
    <div class="day" id="dayName"></div>
    <label for="vendor">Vendor</label>
    <select id="vendor"></select>
    <label for="item">Item (optional)</label>
    <input id="item" type="text" autocomplete="off" placeholder="e.g. Bunny">
    <div class="row">
      <div>
        <label for="qty">Qty</label>
        <input id="qty" class="big center" type="text" inputmode="decimal" autocomplete="off" value="1">
      </div>
      <div class="w2">
        <label for="price">Price each (R)</label>
        <input id="price" class="big" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
      </div>
      <div>
        <label for="pct">Comm %</label>
        <input id="pct" class="big center" type="text" inputmode="decimal" autocomplete="off">
      </div>
    </div>
    <div class="lineTotal" id="lineTotal"></div>
    <button class="btn" id="addBtn">Add Sale</button>
  </section>

  <h2 class="section">Owed to Vendors</h2>
  <div id="owedList"></div>
  <section class="card summary grand" id="owedTotal"></section>
  <div id="ownStock"></div>
</main>

<footer>
  <button class="btn" id="payBtn">Pay a Vendor</button>
  <button class="btn secondary" id="sendPending" hidden></button>
</footer>

<!-- Edit a sale -->
<dialog id="editDlg">
  <h2>Change Sale</h2>
  <p id="editLockNote" class="warn" hidden></p>
  <label for="editVendor">Vendor</label>
  <select id="editVendor"></select>
  <label for="editItem">Item</label>
  <input id="editItem" type="text">
  <div class="row">
    <div><label for="editQty">Qty</label><input id="editQty" class="center" type="text" inputmode="decimal"></div>
    <div class="w2"><label for="editPrice">Price each (R)</label><input id="editPrice" type="text" inputmode="decimal"></div>
    <div><label for="editPct">Comm %</label><input id="editPct" class="center" type="text" inputmode="decimal"></div>
  </div>
  <div class="row">
    <button class="btn danger" id="editDelete">Delete</button>
    <button class="btn" id="editSave">Save</button>
  </div>
  <button class="btn secondary" id="editCancel">Cancel</button>
</dialog>

<!-- Pay a vendor -->
<dialog id="payDlg">
  <h2>Pay a Vendor</h2>
  <label for="payVendor">Vendor</label>
  <select id="payVendor"></select>
  <div class="sum" id="paySummary"></div>

  <label>Deductions (kept back from the payment)</label>
  <div id="dedList"></div>
  <button class="btn secondary small" id="addDed" style="margin-top:8px">+ Add a deduction</button>
  <datalist id="dedTypes"></datalist>

  <div class="row">
    <div class="w2">
      <label for="payAmount">Amount paid (R)</label>
      <input id="payAmount" class="big" type="text" inputmode="decimal" autocomplete="off">
    </div>
    <div class="w2">
      <label for="payDate">Date paid</label>
      <input id="payDate" type="date">
    </div>
  </div>
  <label>Paid by</label>
  <div class="seg" id="payMethod">
    <button type="button" data-m="EFT" class="on">EFT</button>
    <button type="button" data-m="Cash">Cash</button>
  </div>
  <div class="sum" id="payAfter"></div>
  <button class="btn secondary" id="payRemit">Remittance for the Vendor (PDF)</button>
  <div class="row">
    <button class="btn secondary" id="payCancel">Cancel</button>
    <button class="btn" id="paySave">Paid &amp; Send</button>
  </div>
  <p class="hint">Send the remittance to the vendor, make the payment, then tap Paid &amp; Send.</p>
</dialog>

<!-- Payments -->
<dialog id="plistDlg">
  <h2>Payments</h2>
  <div class="plist" id="plist"></div>
  <button class="btn" id="plistClose">Close</button>
</dialog>

<!-- Menu -->
<dialog id="menuDlg" class="menu">
  <h2>Menu</h2>
  <button class="btn secondary" id="mPayments">Payments</button>
  <button class="btn secondary" id="mMonthEnd">Month End: Send All Sales</button>
  <button class="btn secondary" id="mLoadVendors">Load Vendor List</button>
  <button class="btn secondary" id="mAddVendor">Add a Vendor</button>
  <button class="btn secondary" id="mResend">Send Everything Again</button>
  <button class="btn secondary" id="mBusiness">Business Name</button>
  <p class="hint" id="mInfo"></p>
  <button class="btn" id="mClose">Close</button>
  <input type="file" id="vendorFile" accept=".csv,text/csv,text/plain,text/comma-separated-values" hidden>
</dialog>

<!-- Add vendor -->
<dialog id="vendDlg">
  <h2>Add a Vendor</h2>
  <p>Use the same name as in BankBooks. New names are added in BankBooks when the file is imported.</p>
  <label for="newVendName">Vendor name</label>
  <input id="newVendName" type="text" autocomplete="off">
  <label for="newVendPct">Commission %</label>
  <input id="newVendPct" type="text" inputmode="decimal" value="10">
  <div class="row">
    <button class="btn secondary" id="vendCancel">Cancel</button>
    <button class="btn" id="vendSave">Add</button>
  </div>
</dialog>

<!-- After a download where sharing isn't available -->
<dialog id="sentDlg">
  <h2>Did it send?</h2>
  <p id="sentText"></p>
  <div class="row">
    <button class="btn secondary" id="sentNo">No</button>
    <button class="btn" id="sentYes">Yes, mark as sent</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* Sales Book: write up sales per vendor per day. When a vendor is paid, that
   vendor's sales, the deductions (e.g. stall hire) and the payment go to
   BankBooks in one CSV file:

     type,uid,date,vendor_id,vendor,item,qty,price,amount,commission_pct,method,payment_uid

   type is sale, deduction or payment. Every row has a unique uid, so BankBooks
   never imports anything twice. Everything stays on this phone until sent. */

const KEY = 'salesbook.v1';
const $ = id => document.getElementById(id);

let db = load();
let editing = null;      // uid of the sale in the edit dialog
let pendingSend = null;  // what is waiting for "did it send?"
let payTouched = false;  // she typed her own payment amount

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* start empty */ }
  if (!d || !Array.isArray(d.sales)) d = {
    vendors: [{ id: 0, name: 'Own Stock', own: 1, pct: 100 }], sales: [], settings: { business: '' } };
  d.vendors = d.vendors || [];
  d.payments = d.payments || [];
  d.settings = d.settings || {};
  d.settings.dedTypes = d.settings.dedTypes || ['Stall Hire'];
  for (const s of d.sales) {               // older sales had only an amount
    if (typeof s.qty !== 'number') s.qty = 1;
    if (typeof s.price !== 'number') s.price = s.amount;
  }
  for (const v of d.vendors) if (typeof v.carried !== 'number') v.carried = 0;
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('Could not save on this phone: ' + e.message); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- helpers ---------- */
const money = n => (n < 0 ? '-R' : 'R') + Math.abs(n).toLocaleString('en-ZA',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (a, f) => round2(a.reduce((t, x) => t + f(x), 0));
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function niceDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
}
function parseNum(s) {
  // accepts 390, 390.50, 390,50, R 1 390.50
  s = String(s).replace(/[Rr\s]/g, '');
  if (/,\d{1,2}$/.test(s) && !s.includes('.')) s = s.replace(',', '.');
  s = s.replace(/,/g, '');
  const n = Number(s);
  return isFinite(n) && s !== '' ? round2(n) : NaN;
}
function parsePct(str) {
  const n = parseNum(str);
  return n >= 0 && n <= 100 ? n : NaN;
}
function newUid() {
  const r = crypto.getRandomValues ? Array.from(crypto.getRandomValues(new Uint8Array(6)),
    b => b.toString(16).padStart(2, '0')).join('') : Math.random().toString(16).slice(2, 14);
  return Date.now().toString(36) + '-' + r;
}
function vendorBy(vid, name) {
  return db.vendors.find(v => (vid && v.id === vid) || v.name === name);
}
function sameVendor(s, v) { return s.vname.toLowerCase() === v.name.toLowerCase(); }
function salePct(s, v) {
  if (v && v.own) return 100;
  return typeof s.pct === 'number' ? s.pct : (v ? v.pct : 0);
}
function saleComm(s, v) { return round2(s.amount * salePct(s, v) / 100); }
function locked(s) { return s.sent || !!s.paidBy; }
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function csvCell(s) {
  s = String(s ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCSV(text) {
  const rows = [];
  for (const raw of text.replace(/^﻿/, '').split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      if (q) {
        if (c === '"') { if (raw[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    rows.push(out.map(x => x.trim()));
  }
  return rows;
}
function describe(s) {
  const qty = s.qty !== 1 ? `${s.qty} × ` : '';
  const at = s.qty !== 1 ? ` @ ${money(s.price)}` : '';
  return `${qty}${s.item || (s.qty !== 1 ? 'items' : '—')}${at}`;
}

/* ---------- vendors ---------- */
function sortedVendors() {
  return [...db.vendors].sort((a, b) => (b.own - a.own) || a.name.localeCompare(b.name));
}
function fillVendorSelect(sel, chosen, includeOwn = true) {
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = 'Choose the vendor…';
  sel.appendChild(ph);
  for (const v of sortedVendors()) {
    if (!includeOwn && v.own) continue;
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name;
    sel.appendChild(o);
  }
  sel.value = chosen || '';
}
function showVendorPct() {
  const v = vendorBy(null, $('vendor').value);
  $('pct').disabled = !v || !!v.own;
  $('pct').value = v ? String(v.own ? 100 : v.pct) : '';
  showLineTotal();
}
function showLineTotal() {
  const q = parseNum($('qty').value), p = parseNum($('price').value);
  $('lineTotal').innerHTML = q > 0 && p > 0 ? `Amount <b>${money(round2(q * p))}</b>` : '&nbsp;';
}
// What the business owes a vendor on this phone: carried forward + unpaid sales less commission
function vendorOwed(v) {
  const unpaid = db.sales.filter(s => sameVendor(s, v) && !s.paidBy);
  const total = sum(unpaid, s => s.amount);
  const comm = sum(unpaid, s => saleComm(s, v));
  return { unpaid, total, comm, due: round2(total - comm), carried: v.carried || 0,
           owed: round2((v.carried || 0) + total - comm) };
}

/* ---------- rendering ---------- */
let expanded = new Set();   // vendor cards opened by a tap

function render() {
  const date = $('saleDate').value;
  const d = new Date(date + 'T12:00:00');
  $('dayName').textContent = (date === todayISO() ? 'Today, ' : '') +
    d.toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('bizName').textContent = db.settings.business || '';

  // Every vendor with unpaid sales or something carried forward, whatever the dates
  const list = $('owedList');
  list.innerHTML = '';
  let grand = 0, nVend = 0;
  const vendors = sortedVendors().filter(v => !v.own);
  for (const v of vendors) {
    const o = vendorOwed(v);
    if (!o.unpaid.length && !o.carried) continue;
    nVend++;
    grand = round2(grand + o.owed);
    list.appendChild(vendorCard(v, o));
  }
  // Sales for vendors no longer in the list (renamed / removed)
  const known = new Set(db.vendors.map(v => v.name.toLowerCase()));
  const orphans = db.sales.filter(s => !s.paidBy && !known.has(s.vname.toLowerCase()));
  for (const name of [...new Set(orphans.map(s => s.vname))]) {
    const v = { id: 0, name, own: 0, pct: 0, carried: 0 };
    const o = vendorOwed(v);
    nVend++; grand = round2(grand + o.owed);
    list.appendChild(vendorCard(v, o));
  }
  if (!nVend) list.innerHTML = '<div class="card empty">Nothing owed to vendors. New sales show here until the vendor is paid.</div>';
  $('owedTotal').innerHTML = `<span>Owed to vendors${nVend ? ` (${nVend})` : ''}</span><b>${money(grand)}</b>`;

  // Own stock: the business's own sales, until sent at month end
  const own = db.vendors.find(v => v.own);
  const ownBox = $('ownStock');
  ownBox.innerHTML = '';
  if (own) {
    const sales = db.sales.filter(s => sameVendor(s, own) && !s.sent);
    if (sales.length) {
      const o = { unpaid: sales, total: sum(sales, s => s.amount) };
      ownBox.appendChild(vendorCard(own, o));
    }
  }

  const unsentPay = db.payments.filter(p => !p.sent).length;
  $('sendPending').hidden = !unsentPay;
  $('sendPending').textContent = `Send ${unsentPay} payment${unsentPay === 1 ? '' : 's'} not yet sent`;
}

function vendorCard(v, o) {
  const sales = [...o.unpaid].sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  const dates = [...new Set(sales.map(s => s.date))];
  const open = expanded.has(v.name);
  const card = document.createElement('section');
  card.className = 'card vendor';
  const span = !dates.length ? '' : dates.length === 1 ? niceDate(dates[0])
    : `${niceDate(dates[0])} – ${niceDate(dates[dates.length - 1])}`;
  const meta = v.own
    ? `${sales.length} sale${sales.length === 1 ? '' : 's'} not yet sent · ${span}`
    : `${sales.length} sale${sales.length === 1 ? '' : 's'}${span ? ' · ' + span : ''}${o.carried ? ` · ${money(o.carried)} from before` : ''}`;
  const head = document.createElement('div');
  head.className = 'vhead';
  head.innerHTML = `<div><div class="name">${escapeHtml(v.name)}</div><div class="meta">${meta}</div></div>
    <div class="owed">${money(v.own ? o.total : o.owed)}<span class="chev">${open ? '▲' : '▼'}</span></div>`;
  head.onclick = () => { open ? expanded.delete(v.name) : expanded.add(v.name); render(); };
  card.appendChild(head);
  if (!open) return card;

  const body = document.createElement('div');
  body.className = 'vbody';
  const pcts = [...new Set(sales.map(s => salePct(s, v)))];
  for (const day of dates) {
    const items = sales.filter(s => s.date === day);
    const dh = document.createElement('div');
    dh.className = 'dayhead';
    dh.innerHTML = `<span>${new Date(day + 'T12:00:00').toLocaleDateString('en-ZA',
      { weekday: 'short', day: 'numeric', month: 'short' })}</span><span>${money(sum(items, s => s.amount))}</span>`;
    body.appendChild(dh);
    for (const s of items) {
      const line = document.createElement('div');
      line.className = 'line';
      const pctNote = (!v.own && pcts.length > 1) ? ` · ${salePct(s, v)}%` : '';
      line.innerHTML = `<span class="what">${escapeHtml(describe(s))}${pctNote}${s.sent ? '<span class="tag">✓ sent</span>' : ''}</span>
        <span class="amt">${money(s.amount)}</span>`;
      line.onclick = () => openEdit(s.uid);
      body.appendChild(line);
    }
  }
  const tot = document.createElement('div');
  tot.className = 'totals';
  tot.innerHTML = v.own
    ? `<div class="due"><span>Total own stock</span><span>${money(o.total)}</span></div>`
    : `<div><span>Total sales</span><span>${money(o.total)}</span></div>
       <div><span>${pcts.length === 1 ? `Less ${pcts[0]}%` : 'Less commission'}</span><span>${money(o.comm)}</span></div>
       ${o.carried ? `<div><span>${o.carried > 0 ? 'Owed from before' : 'Overpaid before'}</span><span>${money(o.carried)}</span></div>` : ''}
       <div class="due"><span>Owed to ${escapeHtml(v.name)}</span><span>${money(o.owed)}</span></div>`;
  body.appendChild(tot);
  if (!v.own && v.id !== undefined) {
    const f = document.createElement('div');
    f.className = 'vfoot';
    f.innerHTML = '<span class="hint">Tap a sale to change it</span>';
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = 'Pay';
    b.onclick = e => { e.stopPropagation(); openPay(v.name); };
    f.appendChild(b);
    body.appendChild(f);
  }
  card.appendChild(body);
  return card;
}

/* ---------- add / edit sales ---------- */
function readSale(prefix) {
  const id = n => prefix ? prefix + n : n.toLowerCase();
  const q = parseNum($(id('Qty')).value), p = parseNum($(id('Price')).value);
  return { qty: q, price: p, amount: round2(q * p) };
}
function addSale() {
  const vname = $('vendor').value;
  const { qty, price, amount } = readSale('');
  if (!vname) { toast('Choose the vendor first'); $('vendor').focus(); return; }
  if (!(qty > 0)) { toast('Type the quantity'); $('qty').focus(); return; }
  if (!(price > 0)) { toast('Type the price'); $('price').focus(); return; }
  const v = vendorBy(null, vname);
  const pct = v && v.own ? 100 : parsePct($('pct').value);
  if (isNaN(pct)) { toast('Commission % must be between 0 and 100'); $('pct').focus(); return; }
  // Her % becomes this vendor's rate from now on (BankBooks follows on import)
  if (v && !v.own && v.pct !== pct) v.pct = pct;
  db.sales.push({ uid: newUid(), date: $('saleDate').value, vid: v ? v.id : 0, vname,
    item: $('item').value.trim(), qty, price, amount, pct, sent: false, at: Date.now() });
  save();
  expanded.add(vname);
  $('price').value = ''; $('item').value = ''; $('qty').value = '1';
  render(); showLineTotal();
  toast(`${money(amount)} added for ${vname}`);
  $('item').focus();     // same vendor, next item
}
function openEdit(uid) {
  const s = db.sales.find(x => x.uid === uid);
  if (!s) return;
  editing = uid;
  fillVendorSelect($('editVendor'), s.vname);
  $('editItem').value = s.item || '';
  $('editQty').value = String(s.qty);
  $('editPrice').value = s.price.toFixed(2);
  $('editPct').value = String(salePct(s, vendorBy(s.vid, s.vname)));
  const note = s.paidBy ? 'This sale has been paid out and sent to BankBooks. Changes must be made in BankBooks.'
    : s.sent ? 'This sale was already sent to BankBooks. Changes must be made in BankBooks.' : '';
  $('editLockNote').textContent = note;
  $('editLockNote').hidden = !note;
  for (const id of ['editVendor', 'editItem', 'editQty', 'editPrice', 'editPct', 'editSave', 'editDelete'])
    $(id).disabled = locked(s);
  $('editDlg').showModal();
}
function saveEdit() {
  const s = db.sales.find(x => x.uid === editing);
  if (!s || locked(s)) return $('editDlg').close();
  const { qty, price, amount } = readSale('edit');
  if (!$('editVendor').value) return toast('Choose the vendor');
  if (!(qty > 0) || !(price > 0)) return toast('Type the quantity and price');
  const v = vendorBy(null, $('editVendor').value);
  const pct = v && v.own ? 100 : parsePct($('editPct').value);
  if (isNaN(pct)) return toast('Commission % must be between 0 and 100');
  Object.assign(s, { vname: $('editVendor').value, vid: v ? v.id : 0, item: $('editItem').value.trim(),
    qty, price, amount, pct });
  save(); $('editDlg').close(); render();
}
function deleteEdit() {
  const s = db.sales.find(x => x.uid === editing);
  if (!s || locked(s)) return;
  if (!confirm(`Delete ${money(s.amount)} for ${s.vname}?`)) return;
  db.sales = db.sales.filter(x => x.uid !== editing);
  save(); $('editDlg').close(); render();
}

/* ---------- pay a vendor ---------- */
function openPay(name) {
  fillVendorSelect($('payVendor'), name || '', false);
  $('dedList').innerHTML = '';
  $('payDate').value = todayISO();
  setMethod('EFT');
  payTouched = false;
  $('payAmount').value = '';
  refreshPay();
  $('payDlg').showModal();
}
function setMethod(m) {
  for (const b of $('payMethod').children) b.classList.toggle('on', b.dataset.m === m);
}
function payMethod() { return $('payMethod').querySelector('.on').dataset.m; }
function addDedRow(what = '', amount = '') {
  const row = document.createElement('div');
  row.className = 'ded';
  row.innerHTML = `<input type="text" list="dedTypes" placeholder="What for" value="${escapeHtml(what)}">
    <input type="text" inputmode="decimal" placeholder="R" value="${escapeHtml(amount)}">
    <button type="button" aria-label="Remove">×</button>`;
  row.querySelector('button').onclick = () => { row.remove(); refreshPay(); };
  row.querySelectorAll('input').forEach(i => i.oninput = refreshPay);
  $('dedList').appendChild(row);
  return row;
}
function readDeds() {
  return [...$('dedList').children].map(r => {
    const [w, a] = r.querySelectorAll('input');
    return { what: w.value.trim().replace(/\s+/g, ' '), amount: parseNum(a.value) };
  }).filter(d => d.what || !isNaN(d.amount));
}
function refreshPay() {
  $('dedTypes').innerHTML = db.settings.dedTypes.map(t => `<option value="${escapeHtml(t)}">`).join('');
  const v = vendorBy(null, $('payVendor').value);
  if (!v) {
    $('paySummary').innerHTML = '<div>Choose who is being paid.</div>';
    $('payAfter').innerHTML = '';
    $('paySave').disabled = true;
    $('payRemit').disabled = true;
    return;
  }
  const o = vendorOwed(v);
  const dates = o.unpaid.map(s => s.date).sort();
  const span = dates.length ? ` (${niceDate(dates[0])}${dates.length > 1 && dates[0] !== dates[dates.length - 1] ? ' – ' + niceDate(dates[dates.length - 1]) : ''})` : '';
  $('paySummary').innerHTML =
    `<div><span>Unpaid sales: ${o.unpaid.length}${span}</span><span>${money(o.total)}</span></div>
     <div><span>Less commission</span><span>${money(o.comm)}</span></div>
     ${o.carried ? `<div><span>Carried from last payment</span><span>${money(o.carried)}</span></div>` : ''}
     <div class="due"><span>Owed to ${escapeHtml(v.name)}</span><span>${money(o.owed)}</span></div>`;
  const deds = readDeds();
  const dedTotal = sum(deds.filter(d => d.amount > 0), d => d.amount);
  if (!payTouched) $('payAmount').value = Math.max(0, round2(o.owed - dedTotal)).toFixed(2);
  const paid = parseNum($('payAmount').value);
  const left = round2(o.owed - dedTotal - (isNaN(paid) ? 0 : paid));
  $('payAfter').innerHTML =
    `${dedTotal ? `<div><span>Deductions</span><span>${money(dedTotal)}</span></div>` : ''}
     <div class="due"><span>${left < 0 ? 'Overpaid (carried forward)' : 'Still owed after this'}</span><span>${money(Math.abs(left))}</span></div>`;
  $('paySave').disabled = false;
  $('payRemit').disabled = false;
}
async function savePay() {
  const v = vendorBy(null, $('payVendor').value);
  if (!v) return toast('Choose the vendor');
  const deds = readDeds();
  for (const d of deds) {
    if (!d.what) return toast('Say what each deduction is for');
    if (!(d.amount > 0)) return toast(`Type the amount for ${d.what}`);
  }
  const amount = parseNum($('payAmount').value);
  if (isNaN(amount) || amount < 0) return toast('Type the amount paid');
  if (!$('payDate').value) return toast('Choose the date paid');
  const o = vendorOwed(v);
  if (amount === 0 && !deds.length) return toast('Nothing paid or deducted');
  const dedTotal = sum(deds, d => d.amount);
  const p = {
    uid: newUid(), date: $('payDate').value, vid: v.id, vname: v.name, method: payMethod(),
    amount, deductions: deds.map(d => ({ uid: newUid(), what: d.what, amount: d.amount })),
    sales: o.unpaid.map(s => s.uid), owed: o.owed, carriedBefore: o.carried,
    carriedAfter: round2(o.owed - dedTotal - amount), sent: false, at: Date.now()
  };
  db.payments.push(p);
  for (const s of o.unpaid) s.paidBy = p.uid;
  v.carried = p.carriedAfter;
  for (const d of deds)   // remember what she deducts for
    if (!db.settings.dedTypes.some(t => t.toLowerCase() === d.what.toLowerCase())) db.settings.dedTypes.push(d.what);
  save();
  $('payDlg').close();
  render();
  await sendPayments([p]);
}

/* ---------- remittance advice (PDF) ----------
   A small PDF writer (Helvetica, A4) so the app needs no extra files and
   works without signal. */
const HELV = (() => {
  const w = {}; const set = (chars, v) => { for (const c of chars) w[c] = v; };
  set(' !,./:;I[\\]ft', 278); set('"', 355); set('#$0123456789?L_abdeghnopqu', 556);
  set('%', 889); set('&ABEKPSVXY', 667); set("'", 191); set('()-`r', 333); set('*', 389);
  set('+<=>~', 584); set('@', 1015); set('CDHNRUw', 722); set('FTZ', 611); set('GOQ', 778);
  set('J', 500); set('M', 833); set('W', 944); set('^', 469); set('cksvxyz', 500);
  set('ijl', 222); set('m', 833); set('{}', 334); set('|', 260);
  return w;
})();
function textWidth(s, size, bold) {
  let t = 0;
  for (const c of s) t += HELV[c] || 556;
  return t * size / 1000 * (bold ? 1.05 : 1);
}
function pdfText(s) {
  // WinAnsi: keep Latin-1, map a few common characters, escape PDF specials
  s = String(s).replace(/[–—]/g, '-').replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"').replace(/×/g, 'x').replace(/[^\x20-\xFF]/g, '?');
  return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
class Pdf {
  constructor() { this.pages = []; this.newPage(); }
  newPage() { this.cur = []; this.pages.push(this.cur); }
  text(x, y, s, o = {}) {
    const size = o.size || 10, bold = !!o.bold;
    s = String(s);
    if (o.max) while (s.length > 1 && textWidth(s, size, bold) > o.max) s = s.slice(0, -2) + '…';
    s = s.replace(/…$/, '...');
    let px = x;
    if (o.align === 'right') px = x - textWidth(s, size, bold);
    const g = o.gray != null ? o.gray : 0;
    this.cur.push(`BT ${g} g /${bold ? 'F2' : 'F1'} ${size} Tf ${px.toFixed(2)} ${(842 - y).toFixed(2)} Td (${pdfText(s)}) Tj ET`);
  }
  line(x1, y1, x2, y2, w = 0.6, gray = 0.6) {
    this.cur.push(`${gray} G ${w} w ${x1} ${842 - y1} m ${x2} ${842 - y2} l S`);
  }
  box(x, y, w, h, r, g, b) {
    this.cur.push(`${r} ${g} ${b} rg ${x} ${842 - y - h} ${w} ${h} re f`);
  }
  bytes() {
    const objs = [];
    const add = s => { objs.push(s); return objs.length; };
    const cat = add('');                       // filled in below
    const pagesId = add('');
    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids = [];
    for (const ops of this.pages) {
      const content = ops.join('\n');
      const cId = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] ` +
        `/Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cId} 0 R >>`));
    }
    objs[cat - 1] = `<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    objs[pagesId - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out = '%PDF-1.4\n';
    const offs = [];
    objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` +
      offs.map(n => String(n).padStart(10, '0') + ' 00000 n \n').join('') +
      `trailer\n<< /Size ${objs.length + 1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    const b = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) b[i] = out.charCodeAt(i) & 0xFF;
    return b;
  }
}
const longDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-ZA',
  { day: 'numeric', month: 'short', year: 'numeric' });
const pdfMoney = n => (n < 0 ? '-R ' : 'R ') + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// r: { vendor, date, method, ref, sales[], carried, deductions[{what,amount}], amount }
function remittancePdf(r) {
  const pdf = new Pdf();
  const L = 50, R = 545;
  const biz = db.settings.business || '';
  const v = vendorBy(null, r.vendor) || { own: 0, pct: 0, name: r.vendor };
  const sales = [...r.sales].sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  const total = sum(sales, s => s.amount);
  const comm = sum(sales, s => saleComm(s, v));
  const pcts = [...new Set(sales.map(s => salePct(s, v)))];
  const owed = round2(r.carried + total - comm);
  const dedTotal = sum(r.deductions, d => d.amount);
  const left = round2(owed - dedTotal - r.amount);

  const head = first => {
    pdf.box(0, 0, 595, 8, 0.184, 0.420, 0.310);
    pdf.text(L, 52, biz || 'Remittance Advice', { size: 18, bold: true, max: 330 });
    pdf.text(R, 50, 'REMITTANCE ADVICE', { size: 12, bold: true, align: 'right', gray: 0.25 });
    pdf.line(L, 66, R, 66, 1, 0.75);
    if (first) {
      pdf.text(L, 90, 'Paid to', { size: 9, gray: 0.4 });
      pdf.text(L, 106, r.vendor, { size: 13, bold: true, max: 300 });
      pdf.text(380, 90, 'Date', { size: 9, gray: 0.4 });
      pdf.text(R, 90, longDate(r.date), { size: 10, align: 'right' });
      pdf.text(380, 106, 'Payment by', { size: 9, gray: 0.4 });
      pdf.text(R, 106, r.method === 'Cash' ? 'Cash' : 'EFT', { size: 10, align: 'right' });
      if (r.ref) {
        pdf.text(380, 122, 'Reference', { size: 9, gray: 0.4 });
        pdf.text(R, 122, r.ref, { size: 10, align: 'right' });
      }
    }
    return first ? 150 : 90;
  };
  const tableHead = y => {
    pdf.text(L, y, 'Date', { size: 9, bold: true });
    pdf.text(115, y, 'Item', { size: 9, bold: true });
    pdf.text(370, y, 'Qty', { size: 9, bold: true, align: 'right' });
    pdf.text(450, y, 'Price each', { size: 9, bold: true, align: 'right' });
    pdf.text(R, y, 'Amount', { size: 9, bold: true, align: 'right' });
    pdf.line(L, y + 5, R, y + 5);
    return y + 19;
  };

  let y = tableHead(head(true));
  if (!sales.length) {
    pdf.text(L, y, 'No new sales in this payment.', { size: 10, gray: 0.4 });
    y += 16;
  }
  for (const s of sales) {
    if (y > 760) { pdf.newPage(); y = tableHead(head(false)); }
    pdf.text(L, y, longDate(s.date), { size: 9.5 });
    pdf.text(115, y, s.item || '-', { size: 9.5, max: 215 });
    pdf.text(370, y, String(s.qty), { size: 9.5, align: 'right' });
    pdf.text(450, y, pdfMoney(s.price), { size: 9.5, align: 'right' });
    pdf.text(R, y, pdfMoney(s.amount), { size: 9.5, align: 'right' });
    y += 15;
  }
  pdf.line(L, y - 9, R, y - 9);

  // Totals
  const rows = [['Total sales', total]];
  rows.push([pcts.length === 1 ? `Less commission (${pcts[0]}%)` : 'Less commission', -comm]);
  if (r.carried) rows.push([r.carried > 0 ? 'Owed from before' : 'Overpaid before', r.carried]);
  const needed = 20 * (rows.length + r.deductions.length + 4);
  if (y + needed > 800) { pdf.newPage(); y = head(false); }
  y += 8;
  const tot = (label, val, o = {}) => {
    pdf.text(300, y, label, { size: 10.5, bold: o.bold, gray: o.gray });
    pdf.text(R, y, pdfMoney(val), { size: 10.5, bold: o.bold, align: 'right', gray: o.gray });
    y += 18;
  };
  for (const [l, val] of rows) tot(l, val);
  pdf.line(300, y - 12, R, y - 12);
  tot('Amount owed', owed, { bold: true });
  for (const d of r.deductions) tot(`Less ${d.what}`, -d.amount);
  y += 4;
  pdf.box(292, y - 15, R - 292 + 8, 24, 0.906, 0.941, 0.918);
  tot(r.method === 'Cash' ? 'Payment (cash)' : 'Payment (EFT)', r.amount, { bold: true });
  y += 2;
  if (left) tot(left > 0 ? 'Still owed after this payment' : 'Overpaid (carried forward)',
    Math.abs(left), { gray: 0.3 });

  pdf.text(L, 815, `${biz ? biz + ' - ' : ''}remittance advice${r.ref ? ' ' + r.ref : ''}`,
    { size: 8, gray: 0.55 });
  const name = `Remittance-${r.vendor}-${r.date}`.replace(/[^\w-]+/g, '-') + '.pdf';
  return new File([pdf.bytes()], name, { type: 'application/pdf' });
}
const payRef = uid => 'P' + uid.replace(/[^a-z0-9]/gi, '').slice(-6).toUpperCase();

async function shareRemittance(file, vendor) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name, text: `Remittance advice for ${vendor}` }); }
    catch (e) { if (e.name !== 'AbortError') alert('Could not share the PDF: ' + e.message); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Remittance saved to Downloads');
}
// From the Pay screen, before the payment is made
function remittanceFromDialog() {
  const v = vendorBy(null, $('payVendor').value);
  if (!v) return toast('Choose the vendor');
  const deds = readDeds();
  for (const d of deds) {
    if (!d.what) return toast('Say what each deduction is for');
    if (!(d.amount > 0)) return toast(`Type the amount for ${d.what}`);
  }
  const amount = parseNum($('payAmount').value);
  if (isNaN(amount) || amount < 0) return toast('Type the amount to be paid');
  const o = vendorOwed(v);
  shareRemittance(remittancePdf({ vendor: v.name, date: $('payDate').value || todayISO(),
    method: payMethod(), ref: '', sales: o.unpaid, carried: o.carried, deductions: deds, amount }), v.name);
}
// For a payment already made (Menu > Payments)
function remittanceForPayment(p) {
  const ids = new Set(p.sales);
  shareRemittance(remittancePdf({ vendor: p.vname, date: p.date, method: p.method, ref: payRef(p.uid),
    sales: db.sales.filter(s => ids.has(s.uid)), carried: p.carriedBefore || 0,
    deductions: p.deductions, amount: p.amount }), p.vname);
}

    row.className = 'line';
    row.innerHTML = `<span class="what">${niceDate(p.date)} · ${escapeHtml(p.vname)} · ${p.method}
      ${ded ? ` · less ${money(ded)}` : ''}${p.sent ? '<span class="tag">✓ sent</span>' : ' <span class="warn">not sent</span>'}</span>
      <span class="amt">${money(p.amount)}</span>`;
    const rb = document.createElement('button');
    rb.className = 'btn link'; rb.textContent = 'Remittance';
    rb.onclick = () => remittanceForPayment(p);
    row.appendChild(rb);
    if (!p.sent && isLastPayment(p)) {
      const b = document.createElement('button');
      b.className = 'btn link'; b.textContent = 'Undo';
      b.onclick = () => undoPayment(p);
      row.appendChild(b);
    }
    list.appendChild(row);
  }
  $('menuDlg').close();
  $('plistDlg').showModal();
}
function isLastPayment(p) {
  return !db.payments.some(x => x.vname === p.vname && x.at > p.at);
}
function undoPayment(p) {
  if (!confirm(`Undo the payment of ${money(p.amount)} to ${p.vname}? Its sales become unpaid again.`)) return;
  for (const s of db.sales) if (s.paidBy === p.uid) delete s.paidBy;
  const v = vendorBy(p.vid, p.vname);
  if (v) v.carried = p.carriedBefore || 0;
  db.payments = db.payments.filter(x => x.uid !== p.uid);
  save(); render(); openPayments();
}

/* ---------- sending ---------- */
const HEAD = 'type,uid,date,vendor_id,vendor,item,qty,price,amount,commission_pct,method,payment_uid';
function saleRow(s) {
  const v = vendorBy(s.vid, s.vname);
  return ['sale', s.uid, s.date, s.vid || '', s.vname, s.item || '', s.qty, s.price.toFixed(2),
    s.amount.toFixed(2), salePct(s, v), '', s.paidBy || ''];
}
function paymentRows(p) {
  const rows = [];
  for (const d of p.deductions)
    rows.push(['deduction', d.uid, p.date, p.vid || '', p.vname, d.what, '', '', d.amount.toFixed(2), '', '', p.uid]);
  rows.push(['payment', p.uid, p.date, p.vid || '', p.vname, '', '', '', p.amount.toFixed(2), '', p.method, p.uid]);
  return rows;
}
function buildCSV(rows) {
  return [HEAD, ...rows.map(r => r.map(csvCell).join(','))].join('\r\n') + '\r\n';
}
function fileName(kind) {
  const t = new Date(); const p = n => String(n).padStart(2, '0');
  const biz = (db.settings.short || db.settings.business || 'Sales').replace(/[^\w-]+/g, '-');
  return `${biz}-${kind}-${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}.csv`;
}
// Send these payments with their sales and deductions
function sendPayments(payments) {
  const rows = [];
  const saleUids = new Set(payments.flatMap(p => p.sales));
  for (const s of db.sales) if (saleUids.has(s.uid)) rows.push(saleRow(s));
  for (const p of payments) rows.push(...paymentRows(p));
  const total = sum(payments, p => p.amount);
  const who = payments.length === 1 ? payments[0].vname : `${payments.length} vendors`;
  return shareFile(rows, fileName('payment'), `Payment: ${who}, ${money(total)}`,
    { sales: [...saleUids], payments: payments.map(p => p.uid) });
}
function sendSales(sales, label) {
  return shareFile(sales.map(saleRow), fileName('sales'),
    `${label}: ${sales.length} sale(s), ${money(sum(sales, s => s.amount))}`,
    { sales: sales.map(s => s.uid), payments: [] });
}
async function shareFile(rows, name, text, marks) {
  if (!rows.length) return toast('Nothing to send');
  const file = new File([buildCSV(rows)], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name, text: text + ' - for BankBooks' });
      markSent(marks);
      toast('Sent');
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not share the file: ' + e.message);
      else toast('Not sent - use "Send … not yet sent" to try again');
    }
    return;
  }
  // No share sheet (e.g. a laptop): download the file instead, then ask.
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  pendingSend = marks;
  $('sentText').textContent = `${text}. The file ${name} was saved to Downloads. ` +
    'Once it has gone to BankBooks, mark it as sent.';
  $('sentDlg').showModal();
}
function markSent(marks) {
  const s = new Set(marks.sales), p = new Set(marks.payments);
  for (const x of db.sales) if (s.has(x.uid)) x.sent = true;
  for (const x of db.payments) if (p.has(x.uid)) x.sent = true;
  save(); render();
}

/* ---------- vendor list from BankBooks ---------- */
async function loadVendorFile(file) {
  const rows = parseCSV(await file.text());
  const head = (rows.shift() || []).map(h => h.toLowerCase());
  const iId = head.indexOf('vendor_id'), iName = head.indexOf('vendor'),
        iOwn = head.indexOf('own_stock'), iPct = head.indexOf('commission_pct'),
        iBiz = head.indexOf('business'), iShort = head.indexOf('short_name');
  if (iName < 0 || iId < 0 || head.includes('type'))
    return alert('That is not a vendor list from BankBooks (made with Vendor Sales > Send Vendor List to Phone).');
  // The business name comes from BankBooks with the list
  const biz = iBiz >= 0 ? (rows.find(r => r[iBiz]) || [])[iBiz] : '';
  if (biz) db.settings.business = biz;
  const short = iShort >= 0 ? (rows.find(r => r[iShort]) || [])[iShort] : '';
  if (iShort >= 0) db.settings.short = short || '';
  const fromFile = rows.filter(r => r[iName]).map(r => ({
    id: Number(r[iId]) || 0, name: r[iName], own: Number(r[iOwn]) ? 1 : 0, pct: Number(r[iPct]) || 0, carried: 0 }));
  for (const v of fromFile) {
    const old = db.vendors.find(x => x.name.toLowerCase() === v.name.toLowerCase());
    if (!old) continue;
    v.carried = old.carried || 0;   // what's carried forward lives on the phone
    if (!v.own && db.sales.some(s => !s.sent && !s.paidBy && sameVendor(s, v)))
      v.pct = old.pct;              // her newer rate hasn't reached BankBooks yet
  }
  const known = new Set(fromFile.map(v => v.name.toLowerCase()));
  const extra = db.vendors.filter(v => !v.id && !v.own && !known.has(v.name.toLowerCase()));
  db.vendors = fromFile.concat(extra);
  if (!db.vendors.some(v => v.own)) db.vendors.unshift({ id: 0, name: 'Own Stock', own: 1, pct: 100, carried: 0 });
  for (const s of db.sales) {       // pick up the BankBooks id
    const v = db.vendors.find(x => sameVendor(s, x));
    if (v) { s.vid = v.id; s.vname = v.name; }
  }
  for (const p of db.payments) {
    const v = db.vendors.find(x => x.name.toLowerCase() === p.vname.toLowerCase());
    if (v) { p.vid = v.id; p.vname = v.name; }
  }
  save();
  fillVendorSelect($('vendor'), $('vendor').value);
  showVendorPct();
  render();
  if ($('menuDlg').open) $('menuDlg').close();
  toast(`${fromFile.length} vendors loaded`);
}

/* A file shared to the app from WhatsApp, email etc. (see sw.js) */
async function takeSharedFile() {
  if (!new URLSearchParams(location.search).has('shared')) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('salesbook-inbox');
    const r = await cache.match('shared-file');
    if (!r) return toast('Nothing was received - try sharing again');
    await cache.delete('shared-file');
    const name = decodeURIComponent(r.headers.get('X-File-Name') || 'file');
    await loadVendorFile(new File([await r.blob()], name));
  } catch (e) { alert('Could not read the shared file: ' + e.message); }
}

/* ---------- wiring ---------- */
$('saleDate').value = todayISO();
$('saleDate').onchange = () => { if (!$('saleDate').value) $('saleDate').value = todayISO(); render(); };
$('prevDay').onclick = () => { $('saleDate').value = shiftDate($('saleDate').value, -1); render(); };
$('nextDay').onclick = () => { $('saleDate').value = shiftDate($('saleDate').value, 1); render(); };
$('addBtn').onclick = addSale;
for (const id of ['item', 'qty', 'price', 'pct'])
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') addSale(); });
$('qty').oninput = showLineTotal;
$('price').oninput = showLineTotal;
$('vendor').onchange = () => { showVendorPct(); if ($('vendor').value) $('item').focus(); };

$('editSave').onclick = saveEdit;
$('editDelete').onclick = deleteEdit;
$('editCancel').onclick = () => $('editDlg').close();

$('payBtn').onclick = () => openPay($('vendor').value && !vendorBy(null, $('vendor').value)?.own ? $('vendor').value : '');
$('payVendor').onchange = () => { payTouched = false; refreshPay(); };
$('payAmount').oninput = () => { payTouched = true; refreshPay(); };
$('addDed').onclick = () => {
  const r = addDedRow(db.settings.dedTypes[0] || 'Stall Hire');
  refreshPay();
  r.querySelectorAll('input')[1].focus();
};
for (const b of $('payMethod').children) b.onclick = () => setMethod(b.dataset.m);
$('payCancel').onclick = () => $('payDlg').close();
$('paySave').onclick = savePay;
$('payRemit').onclick = remittanceFromDialog;

$('sendPending').onclick = () => sendPayments(db.payments.filter(p => !p.sent));
$('sentYes').onclick = () => { if (pendingSend) markSent(pendingSend); pendingSend = null; $('sentDlg').close(); };
$('sentNo').onclick = () => { pendingSend = null; $('sentDlg').close(); };

$('menuBtn').onclick = () => {
  const unpaid = db.sales.filter(s => !s.paidBy && !(vendorBy(s.vid, s.vname) || {}).own).length;
  const unsent = db.sales.filter(s => !s.sent).length;
  $('mInfo').textContent = `${db.vendors.length} vendors · ${db.sales.length} sales on this phone ` +
    `(${unpaid} not paid out, ${unsent} not sent) · ${db.payments.length} payments.`;
  $('menuDlg').showModal();
};
$('mClose').onclick = () => $('menuDlg').close();
$('mPayments').onclick = openPayments;
$('plistClose').onclick = () => $('plistDlg').close();
$('mMonthEnd').onclick = () => {
  $('menuDlg').close();
  const sales = db.sales.filter(s => !s.sent);
  if (!sales.length) return toast('All sales have been sent');
  if (confirm(`Send all ${sales.length} sale(s) not yet sent, paid or not, so BankBooks has the month's sales?`))
    sendSales(sales, 'Month end');
};
$('mLoadVendors').onclick = () => $('vendorFile').click();
$('vendorFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadVendorFile(f); };
$('mAddVendor').onclick = () => { $('menuDlg').close(); $('newVendName').value = ''; $('newVendPct').value = '10'; $('vendDlg').showModal(); };
$('vendCancel').onclick = () => $('vendDlg').close();
$('vendSave').onclick = () => {
  const name = $('newVendName').value.trim().replace(/\s+/g, ' ');
  const pct = parsePct($('newVendPct').value);
  if (!name) return toast('Type the vendor name');
  if (db.vendors.some(v => v.name.toLowerCase() === name.toLowerCase())) return toast('That vendor is already there');
  db.vendors.push({ id: 0, name, own: 0, pct: isNaN(pct) ? 10 : pct, carried: 0 });
  save(); fillVendorSelect($('vendor'), name); showVendorPct(); $('vendDlg').close(); render();
  toast(`${name} added`);
};
$('mResend').onclick = () => {
  $('menuDlg').close();
  if (!confirm('Send every sale and payment on this phone again? BankBooks skips what it already has.')) return;
  const rows = db.sales.map(saleRow);
  for (const p of db.payments) rows.push(...paymentRows(p));
  shareFile(rows, fileName('everything'), 'Everything on the phone',
    { sales: db.sales.map(s => s.uid), payments: db.payments.map(p => p.uid) });
};
$('mBusiness').onclick = () => {
  const b = prompt('Business name (shown at the top and in the file name):', db.settings.business || '');
  if (b !== null) { db.settings.business = b.trim(); save(); render(); }
};

fillVendorSelect($('vendor'));
showVendorPct();
render();
takeSharedFile();

if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
